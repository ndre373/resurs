# Автосборка и публикация приложения на GitHub Pages.
# Срабатывает на каждый push в main: собирает клиент (vite build),
# дублирует index.html как 404.html (SPA-фолбэк для прямых ссылок)
# и выкладывает dist/public на Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # сначала тесты и проверка типов — сломанная версия не уйдёт на сайт
      - run: npm run check
      - run: npx vitest run
      - run: npx vite build
        env:
          PAGES_BUILD: "1"
      # генерирует sw-assets.js — полный список файлов для офлайн-кэша
      - run: node scripts/gen-sw-assets.mjs
      - run: cp dist/public/index.html dist/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
